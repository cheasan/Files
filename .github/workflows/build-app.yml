# Abstract:
#   Builds Files (Release, x64) and uploads an installable self-signed
#   sideload MSIX package as a workflow artifact. No secrets required.

name: Files Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'builds/**'
      - 'docs/**'
      - '*.md'

run-name: Files Build (${{ github.event_name }})

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: '${{ github.workspace }}\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files.App\Files.App.csproj'
  CONFIGURATION: 'Release'
  ARCHITECTURE: 'x64'
  ARTIFACTS_STAGING_DIR: '${{ github.workspace }}\artifacts'
  APPX_PACKAGE_DIR: '${{ github.workspace }}\artifacts\AppxPackages\'
  APPX_SELFSIGNED_CERT_PATH: '${{ github.workspace }}\artifacts\FilesApp_SelfSigned.pfx'

jobs:

  build:

    runs-on: windows-2025-vs2026

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore Files
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_PATH `
          -t:Restore `
          -p:Platform=$env:ARCHITECTURE `
          -p:Configuration=$env:CONFIGURATION `
          -v:quiet

    - name: Create self signed cert as a pfx file
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path $env:ARTIFACTS_STAGING_DIR | Out-Null
        ./.github/scripts/Generate-SelfCertPfx.ps1 -Destination "$env:APPX_SELFSIGNED_CERT_PATH"

    - name: Build & package Files
      shell: pwsh
      run: |
        msbuild `
          $env:APP_PROJECT_PATH `
          -t:Build `
          -p:Configuration=$env:CONFIGURATION `
          -p:Platform=$env:ARCHITECTURE `
          -p:AppxBundlePlatforms=$env:ARCHITECTURE `
          -p:AppxBundle=Always `
          -p:GenerateAppxPackageOnBuild=true `
          -p:UapAppxPackageBuildMode=SideloadOnly `
          -p:AppxPackageDir=$env:APPX_PACKAGE_DIR `
          -p:AppxPackageSigningEnabled=true `
          -p:PackageCertificateKeyFile=$env:APPX_SELFSIGNED_CERT_PATH `
          -p:PackageCertificatePassword="" `
          -p:PackageCertificateThumbprint="" `
          -v:quiet

    - name: Stage the package with install notes
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "$env:ARTIFACTS_STAGING_DIR\Package" | Out-Null
        Copy-Item -Path "$env:APPX_PACKAGE_DIR*" -Destination "$env:ARTIFACTS_STAGING_DIR\Package" -Recurse
        Copy-Item -Path $env:APPX_SELFSIGNED_CERT_PATH -Destination "$env:ARTIFACTS_STAGING_DIR\Package"
        @'
        # Installing Files (self-signed CI build)

        1. Extract the downloaded archive.
        2. Enable Developer Mode: Settings > System > For developers.
        3. Trust the signing certificate from an elevated PowerShell:
           Import-PfxCertificate -FilePath .\FilesApp_SelfSigned.pfx -CertStoreLocation Cert:\LocalMachine\Root -Password (New-Object System.Security.SecureString)
        4. Install the app from the same PowerShell:
           .\Files_*_Test\Add-AppDevPackage.ps1 -Force

        Note: the package is signed with a self-signed certificate; only trust it on machines where you accept that risk.
        '@ | Set-Content -Path "$env:ARTIFACTS_STAGING_DIR\Package\INSTALL.md"

    - name: Upload the package to the Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: 'Files Package (Release, x64)'
        path: ${{ env.ARTIFACTS_STAGING_DIR }}\Package
        if-no-files-found: error
